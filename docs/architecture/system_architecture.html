<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DropoutGuard — Proposed System Architecture</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .header-bar {
      width: 100%;
      max-width: 1600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 8px;
    }
    .title-group h1 {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .title-group p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .badge-group {
      display: flex;
      gap: 8px;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-blue { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-green { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-amber { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    
    .diagram-container {
      width: 100%;
      max-width: 1600px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      border: 1px solid #334155;
    }
    .diagram-container svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .action-bar {
      margin-top: 16px;
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #0284c7;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="title-group">
      <h1>DropoutGuard — Proposed System Architecture</h1>
      <p>Enterprise AI-Powered Academic Dropout Prediction, Explainability (TreeSHAP) &amp; Prescriptive Recourse Ecosystem</p>
    </div>
    <div class="badge-group">
      <span class="badge badge-blue">SIH 2026</span>
      <span class="badge badge-green">PSID 7-L</span>
      <span class="badge badge-amber">Team COGNITEX (107)</span>
    </div>
  </div>

  <div class="diagram-container">
    <!-- SVG Embedding -->
    <object data="proposed_system_architecture.svg" type="image/svg+xml" style="width: 100%; height: auto;"></object>
  </div>

  <div class="action-bar">
    <a href="proposed_system_architecture.svg" download="DropoutGuard_Proposed_Architecture.svg" class="btn">⬇️ Download High-Res SVG</a>
  </div>
</body>
</html>
