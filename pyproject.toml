[project]
name = "dropoutguard"
version = "0.1.0"
description = "AI-Powered Academic Dropout Prediction & Intervention System (SIH 2026 PSID 7-L / SDG 4)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "shap",
    "imbalanced-learn",
    "joblib",
    "ucimlrepo",
    "pytest",
    "requests",
    "pyyaml",
    "python-dotenv",
    "pillow",
    "scipy"
]

[project.optional-dependencies]
# Phase 4 FastAPI backend. Installed with: pip install -e ".[backend]"
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27"
]
research = [
    "torch>=2.2.0",
    "pyarrow>=15.0.0",
    "fairlearn>=0.10.0"
]
# Developer tools. Installed with: pip install -e ".[dev]"
dev = [
    "ruff==0.16.10"
]

# The only pyright/Pylance config (relative paths; no machine-specific locations).
[tool.pyright]
include = ["ml", "backend", "scripts", "verification"]
venvPath = "."
venv = ".venv"
extraPaths = ["."]
reportMissingImports = "warning"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "B", "PLE"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares dependencies and parameters as call defaults (Depends, File, Query).
"backend/app/api/v1/endpoints/*.py" = ["B008"]

[tool.setuptools]
packages = ["ml", "backend"]
