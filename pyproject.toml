[project]
name = "dropoutguard"
version = "0.1.0"
description = "AI-Powered Academic Dropout Prediction & Intervention System (SIH 2026 PSID 7-L / SDG 4)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "shap",
    "imbalanced-learn",
    "joblib",
    "ucimlrepo",
    "pytest",
    "requests"
]

[project.optional-dependencies]
# Phase 4 FastAPI backend. Installed with: pip install -e ".[backend]"
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27"
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".",
    ".venv/lib/python3.14/site-packages"
]
reportMissingImports = false

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
