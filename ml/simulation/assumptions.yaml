cohort_metadata:
  target_base_rate:
    value: 0.355
    source: "assumption"
    notes: "No published national higher-education dropout rate for India; simulation value; see sensitivity analysis."

risk_coefficients:
  current_cgpa:
    value_from: "estimated_parameters.json#indian_unit_coefficient.current_cgpa"
    source: "estimated_from_uci"
    notes: "Indian-unit coefficient estimated from UCI ID 697 cu_1st_sem_grade rescaled to a 0-10 CGPA; fitted on the UCI train split (shared estimation/holdout split, holdout excluded). The value lives only in estimated_parameters.json (python -m ml.simulation.estimate_parameters)."
  backlog_count:
    value_from: "estimated_parameters.json#indian_unit_coefficient.backlog_count"
    source: "estimated_from_uci"
    notes: "Indian-unit coefficient estimated from UCI ID 697 unapproved curricular units (enrolled - approved); fitted on the UCI train split (shared estimation/holdout split, holdout excluded). The value lives only in estimated_parameters.json (python -m ml.simulation.estimate_parameters)."
  has_scholarship:
    value_from: "estimated_parameters.json#indian_unit_coefficient.has_scholarship"
    source: "estimated_from_uci"
    notes: "Indian-unit coefficient estimated from UCI ID 697 scholarship_holder; fitted on the UCI train split (shared estimation/holdout split, holdout excluded). The value lives only in estimated_parameters.json (python -m ml.simulation.estimate_parameters)."
  fee_payment_delay_days:
    value_from: "estimated_parameters.json#indian_unit_coefficient.fee_payment_delay_days"
    source: "estimated_from_uci"
    notes: "Indian-unit coefficient estimated from UCI ID 697 binary fee default / debtor indicator; fitted on the UCI train split (shared estimation/holdout split, holdout excluded). The value lives only in estimated_parameters.json (python -m ml.simulation.estimate_parameters)."
  is_first_generation:
    value_from: "estimated_parameters.json#indian_unit_coefficient.is_first_generation"
    source: "estimated_from_uci"
    notes: "Indian-unit coefficient estimated from UCI ID 697 parents' qualification (no higher-education degree); fitted on the UCI train split (shared estimation/holdout split, holdout excluded). The value lives only in estimated_parameters.json (python -m ml.simulation.estimate_parameters)."
  is_hosteler:
    value_from: "estimated_parameters.json#indian_unit_coefficient.is_hosteler"
    source: "estimated_from_uci"
    notes: "Indian-unit coefficient estimated from UCI ID 697 displaced status; fitted on the UCI train split (shared estimation/holdout split, holdout excluded). The value lives only in estimated_parameters.json (python -m ml.simulation.estimate_parameters)."
  lms_logins_per_week:
    value_from: "estimated_parameters.json#indian_unit_coefficient.lms_logins_per_week"
    source: "estimated_from_oulad"
    notes: "Indian-unit coefficient estimated from OULAD ID 349 mean weekly clicks at snapshot t=56; fitted on all registrations active at t=56 (no holdout; OULAD is not used by the sim-to-real check). The value lives only in estimated_parameters.json (python -m ml.simulation.estimate_parameters)."
  days_since_last_lms_activity:
    value_from: "estimated_parameters.json#indian_unit_coefficient.days_since_last_lms_activity"
    source: "estimated_from_oulad"
    notes: "Indian-unit coefficient estimated from OULAD ID 349 inactivity recency at snapshot t=56; fitted on all registrations active at t=56 (no holdout; OULAD is not used by the sim-to-real check). The value lives only in estimated_parameters.json (python -m ml.simulation.estimate_parameters)."
  assignment_submission_lag_days:
    value_from: "estimated_parameters.json#indian_unit_coefficient.assignment_submission_lag_days"
    source: "estimated_from_oulad"
    notes: "Indian-unit coefficient estimated from OULAD ID 349 assignment submission lag at snapshot t=56; fitted on all registrations active at t=56 (no holdout; OULAD is not used by the sim-to-real check). The value lives only in estimated_parameters.json (python -m ml.simulation.estimate_parameters)."
  attendance_deficit_slope:
    value: 0.04000
    source: "assumption"
    notes: "Log-odds added per percentage point of attendance below regulations_and_thresholds.mandatory_attendance_threshold: slope x max(0, threshold - attendance_percentage); no effect at or above the threshold."
  attendance_3m_trend:
    value: -0.08000
    source: "assumption"
    notes: "Deteriorating attendance trajectory slope over 3-month observation window."
  consecutive_absences:
    value: 0.07500
    source: "assumption"
    notes: "Log-odds penalty per consecutive absent day indicating prolonged absence spell."
  cgpa_delta:
    value: -0.40000
    source: "assumption"
    notes: "Acute academic decline log-odds penalty per unit semester-over-semester CGPA drop."
  stem_core_fail_flag:
    value: 0.35000
    source: "assumption"
    notes: "Prerequisite gatekeeping failure penalty in core foundational course."
  gender_male:
    value: 0.0
    source: "assumption"
    notes: "Protected attribute coefficient strictly zero to prevent algorithmic gender bias."
  category_obc:
    value: 0.0
    source: "assumption"
    notes: "Protected demographic category coefficient strictly zero."
  category_sc:
    value: 0.0
    source: "assumption"
    notes: "Protected demographic category coefficient strictly zero."
  category_st:
    value: 0.0
    source: "assumption"
    notes: "Protected demographic category coefficient strictly zero."
  category_ews:
    value: 0.0
    source: "assumption"
    notes: "Protected demographic category coefficient strictly zero."
  interaction_low_att_high_fee:
    value: 0.35000
    source: "assumption"
    notes: "Compound interaction for concurrent attendance crisis (<70%) and chronic fee delay (>20d)."
  interaction_low_cgpa_high_backlogs:
    value: 0.35000
    source: "assumption"
    notes: "Compound interaction for severe academic distress (CGPA < 5.0 and backlogs >= 2)."
  idiosyncratic_noise_std:
    value: 0.85000
    source: "assumption"
    notes: "Standard deviation of unobserved idiosyncratic Gaussian noise in latent risk score."

regulations_and_thresholds:
  mandatory_attendance_threshold:
    value: 75.0
    source: "indian_regulation"
    notes: "Statutory 75% attendance threshold for semester examination eligibility."
  stem_core_pass_mark:
    value: 42.0
    source: "indian_regulation"
    notes: "Passing threshold out of 100 for academic credit in foundational STEM courses."
  dual_crisis_att_threshold:
    value: 70.0
    source: "assumption"
    notes: "Threshold below which attendance crisis compounds with fee delay."
  dual_crisis_fee_threshold:
    value: 20.0
    source: "assumption"
    notes: "Threshold above which fee payment delay compounds with attendance crisis."
  academic_crisis_cgpa_threshold:
    value: 5.0
    source: "assumption"
    notes: "Threshold below which low CGPA triggers year-down / detaining risk."
  academic_crisis_backlog_threshold:
    value: 2.0
    source: "assumption"
    notes: "Threshold for minimum backlogs compounding low CGPA."

