[pytest]
pythonpath = .
testpaths = ml/tests backend/tests
addopts = -v
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5.*:DeprecationWarning
markers =
    db: requires PostgreSQL live test database
    data: requires UCI / OULAD raw benchmark datasets
    artifacts: reads committed generated artifacts (benchmark/simulation JSON, rendered docs, universal models); skipped with the regeneration command if absent
    slow: long running verification test (> 60 s)
